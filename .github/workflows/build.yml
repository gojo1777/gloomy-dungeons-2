name: Build Gloomy Dungeons 2 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-22" \
            "build-tools;25.0.2" \
            "extras;android;m2repository" \
            "extras;google;m2repository"

      - name: Install NDK r14b
        run: |
          mkdir -p "$ANDROID_HOME/ndk"
          wget -q https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp/
          mv /tmp/android-ndk-r14b "$ANDROID_HOME/ndk/14.1.3816874"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/14.1.3816874" >> $GITHUB_ENV

      - name: Set up JDK 8 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Patch build files
        run: |
          # Write patched build.gradle using base64 (avoids YAML/heredoc issues)
          echo "" | base64 -d > build.gradle

          # Update Gradle wrapper to 4.4 (compatible with AGP 2.3.3)
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-4.4-all.zip|' \
            gradle/wrapper/gradle-wrapper.properties

          # Fix jcenter in library build.gradle files
          for f in libraries/*/build.gradle; do
            if [ -f "$f" ]; then
              sed -i 's/jcenter()/mavenCentral()/g' "$f"
              grep -q 'google()' "$f" || sed -i '/mavenCentral()/i\\        google()' "$f"
            fi
          done

          echo "=== Patched build.gradle ===" && cat build.gradle
          echo "=== Gradle wrapper ===" && cat gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleForfdroidWoutgplayWoutzeemoteWoutkoWouthalloweenDebug \
            --no-daemon \
            --stacktrace 2>&1
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Find APK
        if: always()
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GloomyDungeons2-debug
          path: build/outputs/apk/**/*.apk
          retention-days: 30
