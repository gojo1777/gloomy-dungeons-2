name: Build Gloomy Dungeons 2 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 17 needed for sdkmanager
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-28" \
            "build-tools;28.0.3" \
            "extras;android;m2repository" \
            "extras;google;m2repository"

      # NDK r14b — compatible with the renderer.c native code
      - name: Install NDK r14b
        run: |
          mkdir -p "$ANDROID_HOME/ndk"
          wget -q https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp/
          mv /tmp/android-ndk-r14b "$ANDROID_HOME/ndk/14.1.3816874"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/14.1.3816874" >> $GITHUB_ENV

      # Java 8 for AGP 3.4.3 + Gradle 5.6.4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Patch all build files
        run: |
          # --- root build.gradle: AGP 3.4.3, google()+mavenCentral(), ndk-build ---
          echo "" | base64 -d > build.gradle

          # --- libraries/holoeverywhere/build.gradle ---
          echo "" | base64 -d > libraries/holoeverywhere/build.gradle

          # --- libraries/holoeverywhere-preferences/build.gradle ---
          echo "" | base64 -d > libraries/holoeverywhere-preferences/build.gradle

          # --- src/main/jni/Android.mk (needed by AGP 3.x ndk-build) ---
          echo "TE9DQUxfUEFUSCA6PSAkKGNhbGwgbXktZGlyKQoKaW5jbHVkZSAkKENMRUFSX1ZBUlMpCkxPQ0FMX01PRFVMRSAgICA6PSBsaWJyZW5kZXJlcgpMT0NBTF9TUkNfRklMRVMgOj0gcmVuZGVyZXIuYwpMT0NBTF9DRkxBR1MgICAgOj0gLVdlcnJvcgpMT0NBTF9MRExJQlMgICAgOj0gLWxsb2cgLWxHTEVTdjFfQ00KaW5jbHVkZSAkKEJVSUxEX1NIQVJFRF9MSUJSQVJZKQo=" | base64 -d > src/main/jni/Android.mk

          # --- Gradle wrapper: 5.6.4 (compatible with AGP 3.4.3) ---
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-5.6.4-all.zip|' \
            gradle/wrapper/gradle-wrapper.properties

          # --- gradle.properties: remove deprecated NDK flag ---
          sed -i '/android.useDeprecatedNdk/d' gradle.properties

          echo "All patches applied."
          echo "=== build.gradle ===" && head -10 build.gradle
          echo "=== Android.mk ===" && cat src/main/jni/Android.mk
          echo "=== gradle-wrapper ===" && cat gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleForfdroidWoutgplayWoutzeemoteWoutkoWouthalloweenDebug \
            --no-daemon \
            --stacktrace 2>&1
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Find APK
        if: always()
        run: find . -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GloomyDungeons2-debug
          path: build/outputs/apk/**/*.apk
          retention-days: 30
