name: Build Gloomy Dungeons 2 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Manual trigger button in GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest   # FIXED: ubuntu-20.04 deprecated, use latest

    steps:
      # 1. Repo checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Java 8 - required for old Gradle 2.14.1
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      # 3. Android SDK setup
      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      # 4. Install required Android SDK components
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-22" \
            "build-tools;25.0.2" \
            "extras;android;m2repository" \
            "extras;google;m2repository"

      # 5. Install old NDK (project uses deprecated NDK style)
      - name: Install NDK r14b
        run: |
          mkdir -p $ANDROID_HOME/ndk
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
          unzip -q android-ndk-r14b-linux-x86_64.zip
          mv android-ndk-r14b $ANDROID_HOME/ndk/14.1.3816874
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/14.1.3816874" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/14.1.3816874" >> $GITHUB_ENV

      # 6. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 7. Build F-Droid debug APK (no signing required)
      - name: Build Debug APK
        run: |
          ./gradlew assembleForfdroidWoutgplayWoutzeemoteWoutkoWouthalloweenDebug \
            --no-daemon \
            --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      # 8. Find the built APK
      - name: Find APK
        run: find build/outputs/apk -name "*.apk" -type f

      # 9. Upload APK as downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: GloomyDungeons2-debug
          path: build/outputs/apk/**/*.apk
          retention-days: 30
