name: Build Gloomy Dungeons 2 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repo checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 first — sdkmanager requires Java 17+
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Accept licenses and install required SDK components
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-22" \
            "build-tools;25.0.2" \
            "extras;android;m2repository" \
            "extras;google;m2repository"

      # 4. Install old NDK r14b (project uses deprecated NDK style)
      - name: Install NDK r14b
        run: |
          mkdir -p $ANDROID_HOME/ndk
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
          unzip -q android-ndk-r14b-linux-x86_64.zip
          mv android-ndk-r14b $ANDROID_HOME/ndk/14.1.3816874
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/14.1.3816874" >> $GITHUB_ENV

      # 5. Switch to Java 8 — old Gradle 2.14.1 requires Java 8
      - name: Set up JDK 8 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # 6. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 7. Build F-Droid debug APK (no signing required)
      - name: Build Debug APK
        run: |
          ./gradlew assembleForfdroidWoutgplayWoutzeemoteWoutkoWouthalloweenDebug \
            --no-daemon \
            --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      # 8. Find the built APK
      - name: Find APK
        run: find build/outputs/apk -name "*.apk" -type f

      # 9. Upload APK as downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GloomyDungeons2-debug
          path: build/outputs/apk/**/*.apk
          retention-days: 30
