name: Build Gloomy Dungeons 2 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 11 — required for AGP 4.2.2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # Use Java 17 only for sdkmanager, then switch back to 11
      - name: Install Android SDK components
        run: |
          export JAVA_HOME_17=$(dirname $(dirname $(readlink -f /usr/bin/java)))
          sudo apt-get install -y openjdk-17-jdk-headless -qq 2>/dev/null || true
          JAVA17=$(update-alternatives --list java 2>/dev/null | grep java-17 || echo "")
          if [ -n "$JAVA17" ]; then
            export JAVA_HOME=$(dirname $(dirname $JAVA17))
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-28" \
            "build-tools;28.0.3" \
            "extras;android;m2repository" \
            "extras;google;m2repository"

      # NDK r21 — last version with full ndk-build support, compatible with AGP 4.2.2
      - name: Install NDK r21
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Patch all build files
        run: |
          # root build.gradle: AGP 4.2.2 + google()+mavenCentral() + ndk-build
          echo "" | base64 -d > build.gradle

          # libraries/holoeverywhere/build.gradle
          echo "" | base64 -d > libraries/holoeverywhere/build.gradle

          # libraries/holoeverywhere-preferences/build.gradle
          echo "" | base64 -d > libraries/holoeverywhere-preferences/build.gradle

          # src/main/jni/Android.mk — ndk-build config for renderer.c
          echo "TE9DQUxfUEFUSCA6PSAkKGNhbGwgbXktZGlyKQoKaW5jbHVkZSAkKENMRUFSX1ZBUlMpCkxPQ0FMX01PRFVMRSAgICA6PSBsaWJyZW5kZXJlcgpMT0NBTF9TUkNfRklMRVMgOj0gcmVuZGVyZXIuYwpMT0NBTF9DRkxBR1MgICAgOj0gLVdlcnJvcgpMT0NBTF9MRExJQlMgICAgOj0gLWxsb2cgLWxHTEVTdjFfQ00KaW5jbHVkZSAkKEJVSUxEX1NIQVJFRF9MSUJSQVJZKQo=" | base64 -d > src/main/jni/Android.mk

          # Gradle wrapper: 6.9.4 (compatible with AGP 4.2.2)
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-6.9.4-all.zip|' \
            gradle/wrapper/gradle-wrapper.properties

          # Remove deprecated NDK flag
          sed -i '/android.useDeprecatedNdk/d' gradle.properties

          echo "Patches applied successfully."
          echo "=== build.gradle (first 5 lines) ===" && head -5 build.gradle
          echo "=== Android.mk ===" && cat src/main/jni/Android.mk
          echo "=== gradle-wrapper ===" && grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleForfdroidWoutgplayWoutzeemoteWoutkoWouthalloweenDebug \
            --no-daemon \
            --stacktrace 2>&1
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Find APK
        if: always()
        run: find . -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GloomyDungeons2-debug
          path: build/outputs/apk/**/*.apk
          retention-days: 30
