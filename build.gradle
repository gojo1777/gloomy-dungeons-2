// org.zamedev.gloomydungeons2.fullnfree

plugins {
    id "com.android.application"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << '-Xlint:all'
        options.compilerArgs << '-Xlint:-deprecation'
        options.compilerArgs << '-Xlint:-unchecked'
    }
}

android {
    namespace 'zame.game'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        minSdk Integer.parseInt(project.ANDROID_BUILD_MIN_SDK_VERSION)
        targetSdk Integer.parseInt(project.ANDROID_BUILD_TARGET_SDK_VERSION)

        versionName project.VERSION_NAME
        versionCode Integer.parseInt(project.VERSION_CODE)

        externalNativeBuild {
            ndkBuild {
                cFlags '-Werror'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    useLibrary 'org.apache.http.legacy'

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-project.txt'
        }
    }

    flavorDimensions = ['package', 'gplay', 'zeemote', 'langko', 'gfxhalloween']

    productFlavors {
        forgplay {
            dimension 'package'
            applicationId 'org.zamedev.gloomydungeons2.fullnfree'
        }

        forgplayhalloween {
            dimension 'package'
            applicationId 'org.zamedev.gloomydungeons2.halloween'
        }

        forfdroid {
            dimension 'package'
            applicationId 'org.zamedev.gloomydungeons2.opensource'
        }

        withgplay {
            dimension 'gplay'
        }

        woutgplay {
            dimension 'gplay'
        }

        withzeemote {
            dimension 'zeemote'
        }

        woutzeemote {
            dimension 'zeemote'
        }

        withko {
            dimension 'langko'
        }

        woutko {
            dimension 'langko'
        }

        withhalloween {
            dimension 'gfxhalloween'
        }

        wouthalloween {
            dimension 'gfxhalloween'
        }
    }

    // Only build the clean F-Droid/open-source variant (no Google Play, no
    // Zeemote controller support, no Korean assets, no Halloween skin).
    // This avoids building 32 flavor combinations on every CI run.
    variantFilter { variant ->
        def names = variant.flavors*.name
        if (!(names.contains('forfdroid') &&
              names.contains('woutgplay') &&
              names.contains('woutzeemote') &&
              names.contains('woutko') &&
              names.contains('wouthalloween'))) {
            variant.setIgnore(true)
        }
    }
}

dependencies {
    implementation project(':libraries:holoeverywhere')
    implementation project(':libraries:holoeverywhere-preferences')
    implementation fileTree(include: ['*.jar'], dir: 'src/main/libs')
}
